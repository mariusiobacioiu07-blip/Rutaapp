// ── MOTOR ESTADÍSTICO ─────────────────────────────────────────
function poissonPMF(l, k) {
  if (k < 0) return 0;
  let x = -l + k * Math.log(Math.max(l, 0.001));
  for (let i = 1; i <= k; i++) x -= Math.log(i);
  return Math.exp(x);
}

function poissonCDFAtMost(lambda, k) {
  let cum = 0;
  for (let i = 0; i <= k; i++) cum += poissonPMF(lambda, i);
  return cum;
}

// Mercado Over/Under genérico vía Poisson agregado (suma de Poisson independientes ≈ Poisson)
function ouMarket(lambdaTotal, line) {
  const k = Math.floor(line);
  const under = poissonCDFAtMost(lambdaTotal, k);
  return { over: Math.max(0, Math.min(1, 1 - under)), under: Math.max(0, Math.min(1, under)) };
}

// Intervalo de confianza 95% (proporción binomial) sobre el resultado de la simulación Monte Carlo
function ci95(p, n) {
  const se = Math.sqrt(Math.max(p * (1 - p), 0.0001) / n);
  return 1.96 * se;
}

function runEngine(lH, lA) {
  const N = 8, m = [];
  for (let i = 0; i < N; i++) {
    m[i] = [];
    for (let j = 0; j < N; j++) {
      let b = poissonPMF(lH, i) * poissonPMF(lA, j);
      let dc = 1;
      if (i===0&&j===0) dc=1-lH*lA*0.04;
      else if (i===1&&j===0) dc=1+lA*0.04;
      else if (i===0&&j===1) dc=1+lH*0.04;
      else if (i===1&&j===1) dc=1-0.04;
      m[i][j] = Math.max(0, b*dc);
    }
  }
  let tot = m.flat().reduce((a,b)=>a+b,0);
  for (let i=0;i<N;i++) for (let j=0;j<N;j++) m[i][j]/=tot;
  let ph=0,pd=0,pa=0,ou25=0,ou15=0,bt=0,xh=0,xa=0;
  for (let i=0;i<N;i++) for (let j=0;j<N;j++) {
    if(i>j)ph+=m[i][j]; else if(i===j)pd+=m[i][j]; else pa+=m[i][j];
    if(i+j>2.5)ou25+=m[i][j];
    if(i+j>1.5)ou15+=m[i][j];
    if(i>0&&j>0)bt+=m[i][j];
    xh+=i*m[i][j]; xa+=j*m[i][j];
  }
  const scores=[];
  for(let i=0;i<N;i++) for(let j=0;j<N;j++) scores.push({h:i,a:j,p:m[i][j]});
  scores.sort((a,b)=>b.p-a.p);
  // Monte Carlo 20k iteraciones
  const N_MC = 20000;
  function sp(l){let k=0,p=1,L=Math.exp(-l);do{k++;p*=Math.random();}while(p>L);return k-1;}
  let mh=0,md=0,ma=0;
  for(let i=0;i<N_MC;i++){const h=sp(lH),a=sp(lA);if(h>a)mh++;else if(h===a)md++;else ma++;}
  const bl=(dc,mc)=>dc*0.65+mc*0.35;
  const bH=bl(ph,mh/N_MC),bD=bl(pd,md/N_MC),bA=bl(pa,ma/N_MC);
  const t=bH+bD+bA;
  const probH=bH/t, probD=bD/t, probA=bA/t;
  const ci = { h: ci95(probH, N_MC), d: ci95(probD, N_MC), a: ci95(probA, N_MC) };
  return{prob:{h:probH,d:probD,a:probA},ci,ou25,ou15,bt,xg:{h:xh,a:xa},top:scores.slice(0,10)};
}

async function callClaude(home, away, context="") {
  const prompt = `Partido de fútbol: ${home} vs ${away}. ${context}
Eres analista cuantitativo. Con los datos que conoces de estos equipos da:
- attackStrength local (0.5-2.5) y visitante
- defenseStrength local y visitante
- homeAdvantage (1.0-1.3)
- factores clave reales (forma, lesionados conocidos, motivación)
- value bets con motivo estadístico
- probable goleador de cada equipo
- córners esperados (local/visitante, normalmente 3-7 cada uno)
- tarjetas amarillas esperadas (local/visitante, normalmente 1-4 cada uno)
- probabilidad de tarjeta roja (local/visitante, normalmente 0.02-0.15)
- tiros totales esperados (local/visitante, normalmente 8-18 cada uno)
- tiros a puerta esperados (local/visitante, normalmente 3-9 cada uno)
- faltas esperadas (local/visitante, normalmente 8-16 cada uno)
- posesión estimada (local/visitante, deben sumar 100)

Responde SOLO JSON sin markdown:
{"attackStrength":{"home":<n>,"away":<n>},"defenseStrength":{"home":<n>,"away":<n>},"homeAdvantage":<n>,"keyFactors":["<f1>","<f2>","<f3>","<f4>"],"narrative":"<análisis 2-3 frases para apostar>","scorers":[{"name":"<jugador>","team":"home","prob":<0-1>},{"name":"<jugador>","team":"home","prob":<0-1>},{"name":"<jugador>","team":"away","prob":<0-1>},{"name":"<jugador>","team":"away","prob":<0-1>}],"valueBets":[{"market":"<mercado>","pick":"<pick>","reason":"<motivo con dato>","edge":"<alta|media|baja>"}],"confidence":<0-100>,"expectedCorners":{"home":<n>,"away":<n>},"expectedCards":{"home":<n>,"away":<n>},"redCardProb":{"home":<n>,"away":<n>},"expectedShots":{"home":<n>,"away":<n>},"expectedShotsOnTarget":{"home":<n>,"away":<n>},"expectedFouls":{"home":<n>,"away":<n>},"possession":{"home":<n>,"away":<n>}}`;
  try {
    const r = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1400,system:"Analista de fútbol para apuestas. SOLO JSON.",messages:[{role:"user",content:prompt}]})});
    const d = await r.json();
    return JSON.parse(d.content?.[0]?.text?.replace(/```json|```/g,"").trim()||"{}");
  } catch(e){ return {}; }
}

// Calculadora EV / Kelly para cuotas introducidas manualmente
function evCalc(prob, oddStr) {
  const o = parseFloat(oddStr);
  if (!o || o <= 1 || !prob) return null;
  const ev = prob * o - 1;
  const b = o - 1;
  const kellyFull = Math.max(0, (prob * b - (1 - prob)) / b);
  const kelly = Math.min(0.25, kellyFull * 0.5); // medio-Kelly, capado al 25%
  return { ev, edge: prob - 1 / o, kelly };
}

              </div>
              {[
                {l:"Over 2.5 goles",p:result.eng.ou25,c:C.green},
                {l:"Under 2.5 goles",p:1-result.eng.ou25,c:C.red},
                {l:"Over 1.5 goles",p:result.eng.ou15,c:C.green},
                {l:"Ambos marcan — Sí",p:result.eng.bt,c:C.purple},
                {l:"Ambos marcan — No",p:1-result.eng.bt,c:C.mid},
              ].map(({l,p,c})=>(
                <div key={l} style={{marginBottom:11}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                    <span style={{fontSize:13,color:C.text}}>{l}</span>
                    <div style={{display:"flex",gap:10,alignItems:"center"}}>
                      <span style={{fontSize:11,color:C.low}}>cuota {(1/p).toFixed(2)}</span>
                      <span style={{fontFamily:C.mono,fontWeight:700,color:c,fontSize:14}}>{Math.round(p*100)}%</span>
                    </div>
                  </div>
                  <Bar value={p} color={c} h={6}/>
                </div>
              ))}
            </Card>

            {/* Mercados avanzados: córners, tarjetas, tiros, faltas, posesión */}
            <Card>
              <Sec>Mercados avanzados (IA + Poisson)</Sec>
              <AdvRow label="⚐ Córners" color={C.accent}
                home={result.ai.expectedCorners?.home} away={result.ai.expectedCorners?.away}
                ouLine={9.5} ouLambdaTotal={(result.ai.expectedCorners?.home??5)+(result.ai.expectedCorners?.away??4.5)} />
              <AdvRow label="🟨 Tarjetas amarillas" color={C.amber}
                home={result.ai.expectedCards?.home} away={result.ai.expectedCards?.away}
                ouLine={4.5} ouLambdaTotal={(result.ai.expectedCards?.home??2)+(result.ai.expectedCards?.away??2.2)} />
              <AdvRow label="🎯 Tiros a puerta" color={C.green}
                home={result.ai.expectedShotsOnTarget?.home} away={result.ai.expectedShotsOnTarget?.away}
                ouLine={8.5} ouLambdaTotal={(result.ai.expectedShotsOnTarget?.home??5)+(result.ai.expectedShotsOnTarget?.away??4)} />
              <AdvRow label="🥾 Tiros totales" color={C.purple}
                home={result.ai.expectedShots?.home} away={result.ai.expectedShots?.away}
                ouLine={24.5} ouLambdaTotal={(result.ai.expectedShots?.home??12)+(result.ai.expectedShots?.away??10)} />
              <AdvRow label="⚠️ Faltas" color={C.mid}
                home={result.ai.expectedFouls?.home} away={result.ai.expectedFouls?.away}
                ouLine={22.5} ouLambdaTotal={(result.ai.expectedFouls?.home??11)+(result.ai.expectedFouls?.away??11)} />

              <div style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderTop:`1px solid ${C.border}50`,marginBottom:6}}>
                <span style={{fontSize:13,color:C.text}}>🟥 Prob. alguna tarjeta roja</span>
                <span style={{fontFamily:C.mono,fontWeight:800,color:C.red}}>
                  {Math.round(Math.min(1,(result.ai.redCardProb?.home??0.04)+(result.ai.redCardProb?.away??0.04))*100)}%
                </span>
              </div>

              <div style={{marginTop:10}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.low,marginBottom:4}}>
                  <span>{result.home} {Math.round(result.ai.possession?.home??52)}%</span>
                  <span>{Math.round(result.ai.possession?.away??48)}% {result.away}</span>
                </div>
                <div style={{display:"flex",height:8,borderRadius:4,overflow:"hidden"}}>
                  <div style={{width:`${result.ai.possession?.home??52}%`,background:C.accent}}/>
                  <div style={{flex:1,background:C.purple}}/>
                </div>
              </div>
              <div style={{fontSize:10,color:C.low,marginTop:10,lineHeight:1.5}}>
                Líneas O/U sobre Poisson agregado (lambda local+visitante). Estimaciones base de la IA, no datos en vivo del partido.
              </div>
            </Card>

            {/* Marcadores */}
            <Card>
              <Sec>Marcadores más probables</Sec>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {result.eng.top.map((s,i)=>(
                  <div key={i} style={{
                    background:i===0?`${C.accent}18`:C.panel,
                    border:`1px solid ${i===0?C.accent+"50":C.border}`,
                    borderRadius:10,padding:"8px 14px",textAlign:"center",minWidth:60,
                  }}>
                    <div style={{fontFamily:C.mono,fontWeight:800,fontSize:18,color:i===0?C.accent:C.text}}>{s.h}-{s.a}</div>
                    <div style={{fontSize:11,color:C.low,marginTop:2}}>{(s.p*100).toFixed(1)}%</div>
                  </div>
                ))}
              </div>
            </Card>

            {/* Value bets (IA) */}
            {result.ai.valueBets?.length>0&&(
              <Card>
                <Sec>Value Bets detectadas</Sec>
                {result.ai.valueBets.map((vb,i)=>(
                  <div key={i} style={{
                    padding:"12px",marginBottom:8,borderRadius:10,
                    background:C.panel,
                    borderLeft:`3px solid ${vb.edge==="alta"?C.green:vb.edge==="media"?C.amber:C.mid}`,
                  }}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                      <div>
                        <div style={{fontSize:10,color:C.low}}>{vb.market}</div>
                        <div style={{fontSize:15,fontWeight:800,color:C.text}}>{vb.pick}</div>
                      </div>
                      <Pill color={vb.edge==="alta"?C.green:vb.edge==="media"?C.amber:C.mid}>
                        {vb.edge?.toUpperCase()}
                      </Pill>
                    </div>
                    <p style={{fontSize:12,color:C.mid,lineHeight:1.5}}>{vb.reason}</p>
                  </div>
                ))}
              </Card>
            )}

            {/* Calculadora de valor / EV / Kelly con cuotas reales */}
            <Card>
              <Sec>Calculadora de valor (introduce cuotas reales)</Sec>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
                <input style={inp} placeholder="Cuota 1" value={oddsH} onChange={e=>setOddsH(e.target.value)} inputMode="decimal"/>
                <input style={inp} placeholder="Cuota X" value={oddsX} onChange={e=>setOddsX(e.target.value)} inputMode="decimal"/>
                <input style={inp} placeholder="Cuota 2" value={oddsA} onChange={e=>setOddsA(e.target.value)} inputMode="decimal"/>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
                <span style={{fontSize:12,color:C.mid,whiteSpace:"nowrap"}}>Bankroll (€)</span>
                <input style={{...inp,flex:1}} value={bankroll} onChange={e=>setBankroll(e.target.value)} inputMode="decimal"/>
              </div>
              {[
                {label:"1 Local",prob:result.eng.prob.h,odd:oddsH,c:C.green},
                {label:"X Empate",prob:result.eng.prob.d,odd:oddsX,c:C.amber},
                {label:"2 Visitante",prob:result.eng.prob.a,odd:oddsA,c:C.accent},
              ].map(({label,prob,odd,c})=>{
                const r = evCalc(prob, odd);
                if(!r) return (
                  <div key={label} style={{fontSize:12,color:C.low,padding:"8px 0",borderTop:`1px solid ${C.border}30`}}>{label}: introduce la cuota para calcular</div>
                );
                const bk = parseFloat(bankroll)||0;
                return (
                  <div key={label} style={{padding:"10px 0",borderTop:`1px solid ${C.border}30`}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                      <span style={{fontSize:13,fontWeight:700,color:C.text}}>{label}</span>
                      <Pill color={r.edge>0.03?C.green:r.edge>0?C.amber:C.red}>
                        {r.edge>=0?"+":""}{(r.edge*100).toFixed(1)}% edge
                      </Pill>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:C.mid}}>
                      <span>EV: {r.ev>=0?"+":""}{(r.ev*100).toFixed(1)}% / unidad</span>
                      <span>Stake: <b style={{color:c}}>{(r.kelly*bk).toFixed(2)}€</b> ({(r.kelly*100).toFixed(1)}%)</span>
                    </div>
                  </div>
                );
              })}
              <div style={{fontSize:11,color:C.low,marginTop:10,lineHeight:1.5}}>
                Stake calculado con medio-Kelly (conservador), capado al 25% del bankroll. No es asesoramiento financiero — apostar conlleva riesgo real de pérdida de dinero.
              </div>
            </Card>

            {/* Goleadores */}
            {result.ai.scorers?.length>0&&(
              <Card>
                <Sec>Probable goleador</Sec>
                {result.ai.scorers.map((s,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"9px 0",borderBottom:`1px solid ${C.border}20`}}>
                    <div style={{width:32,height:32,borderRadius:"50%",background:`${s.team==="home"?C.accent:C.purple}20`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,color:s.team==="home"?C.accent:C.purple,flexShrink:0}}>{s.name?.[0]}</div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:600,color:C.text}}>{s.name}</div>
                      <div style={{fontSize:11,color:C.low}}>{s.team==="home"?result.home:result.away}</div>
                      <div style={{marginTop:4}}><Bar value={s.prob} color={s.team==="home"?C.accent:C.purple} h={4}/></div>
                    </div>
                    <div style={{fontFamily:C.mono,fontWeight:800,fontSize:17,color:s.team==="home"?C.accent:C.purple}}>{Math.round(s.prob*100)}%</div>
                  </div>
                ))}
              </Card>
            )}
          </div>
        )}

        {/* ── TAB: PARTIDO (widget oficial) ── */}
        {tab==="partido" && (
          <div style={{animation:"fadeUp 0.3s ease"}}>
            {fixtureId && scriptReady ? (
              <div style={{borderRadius:14,overflow:"hidden",border:`1px solid ${C.border}`}}>
                <api-sports-widget
                  data-type="game"
                  data-game-id={fixtureId}
                  data-game-tab="statistics"
                  data-refresh="30"
                />
              </div>
            ) : (
              <Card style={{textAlign:"center",padding:"32px 20px"}}>
                <div style={{fontSize:32,marginBottom:12}}>🔍</div>
                <div style={{fontSize:14,color:C.mid,marginBottom:8}}>Introduce el ID del fixture</div>
                <div style={{fontSize:12,color:C.low,marginBottom:16}}>Encuéntralo en la lista de partidos</div>
                <input
                  style={{...inp, marginBottom:10}}
                  placeholder="ej. 1035443"
                  value={fixtureId}
                  onChange={e=>setFixtureId(e.target.value)}
                />
              </Card>
            )}
          </div>
        )}

        {/* ── TAB: H2H (widget oficial) ── */}
        {tab==="h2h" && (
          <div style={{animation:"fadeUp 0.3s ease"}}>
            {homeId && awayId && scriptReady ? (
              <div style={{borderRadius:14,overflow:"hidden",border:`1px solid ${C.border}`}}>
                <api-sports-widget
                  data-type="h2h"
                  data-h2h={`${homeId}-${awayId}`}
                  data-target-game="modal"
                />
              </div>
            ) : (
              <Card style={{textAlign:"center",padding:"32px 20px"}}>
                <div style={{fontSize:32,marginBottom:12}}>📊</div>
                <div style={{fontSize:14,color:C.mid,marginBottom:8}}>Introduce los IDs de equipos</div>
                <div style={{fontSize:12,color:C.low,marginBottom:16}}>IDs de API-Football (ej. Real Madrid = 541)</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                  <input style={inp} placeholder="ID local" value={homeId} onChange={e=>setHomeId(e.target.value)}/>
                  <input style={inp} placeholder="ID visitante" value={awayId} onChange={e=>setAwayId(e.target.value)}/>
                </div>
                <div style={{fontSize:11,color:C.low}}>Real Madrid=541 · Barcelona=529 · España=9 · Argentina=26</div>
              </Card>
            )}
          </div>
        )}

      </div>
    </div>
  );
}

// ── PANTALLA: STANDINGS ───────────────────────────────────────
function StandingsScreen({ scriptReady }) {
  const LIGAS = [
    {id:1,   name:"🏆 Mundial 2026"},
    {id:140, name:"🇪🇸 La Liga"},
    {id:39,  name:"🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League"},
    {id:78,  name:"🇩🇪 Bundesliga"},
    {id:135, name:"🇮🇹 Serie A"},
    {id:61,  name:"🇫🇷 Ligue 1"},
    {id:2,   name:"⭐ Champions League"},
  ];
  const [liga, setLiga] = useState(1);

  return (
    <div style={{paddingBottom:80}}>
      <div style={{padding:"20px 16px 14px"}}>
        <div style={{fontSize:22,fontWeight:800,letterSpacing:"-0.02em"}}>Clasificaciones</div>
        <div style={{fontSize:13,color:C.mid,marginTop:2}}>Datos reales en tiempo real</div>
      </div>

      {/* Selector liga */}
      <div style={{padding:"0 16px 14px",display:"flex",gap:6,overflowX:"auto",paddingBottom:10}}>
        {LIGAS.map(l=>(
          <button key={l.id} onClick={()=>setLiga(l.id)} style={{
            flexShrink:0,padding:"8px 12px",borderRadius:8,
            border:`1px solid ${liga===l.id?C.accent+"40":C.border}`,
            background:liga===l.id?`${C.accent}15`:C.card,
            color:liga===l.id?C.accent:C.mid,fontSize:12,fontWeight:600,cursor:"pointer",
            whiteSpace:"nowrap",
          }}>{l.name}</button>
        ))}
      </div>

      <div style={{padding:"0 16px"}}>
        {scriptReady ? (
          <div style={{borderRadius:14,overflow:"hidden",border:`1px solid ${C.border}`}}>
            <api-sports-widget
              data-type="standings"
              data-league={liga}
              data-season="2026"
              data-target-team="modal"
            />
          </div>
        ) : (
          <Card style={{textAlign:"center",padding:"40px 20px"}}>
            <Spinner/>
            <div style={{fontSize:13,color:C.mid,marginTop:12}}>Cargando...</div>
          </Card>
        )}
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────
const NAV = [
  {id:"partidos", icon:"⚽", label:"Partidos"},
  {id:"predictor",icon:"⚡", label:"Predecir"},
  {id:"tabla",    icon:"📊", label:"Tabla"},
];

function App() {
  const [screen, setScreen] = useState("partidos");
  const [selectedMatch, setSelectedMatch] = useState(null);
  const scriptReady = useApiSportsScript();

  const goPredict = (partido) => {
    setSelectedMatch(partido);
    setScreen("predictor");
  };

  return (
    <>
      <style>{css}</style>
      <div style={{minHeight:"100vh",background:C.bg,maxWidth:480,margin:"0 auto"}}>

        {/* Config widget (una vez, siempre presente) */}
        {scriptReady && <ApiConfig/>}

        {/* Screens */}
        {screen==="partidos" && <PartidosScreen onPredict={goPredict} scriptReady={scriptReady}/>}
        {screen==="predictor" && <PrediccionScreen partido={selectedMatch} onBack={()=>setScreen("partidos")} scriptReady={scriptReady}/>}
        {screen==="tabla" && <StandingsScreen scriptReady={scriptReady}/>}

        {/* Nav inferior */}
        <div style={{
          position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",
          width:"100%",maxWidth:480,
          background:`${C.card}F5`,backdropFilter:"blur(20px)",
          borderTop:`1px solid ${C.border}`,
          display:"flex",zIndex:100,
          paddingBottom:"env(safe-area-inset-bottom)",
        }}>
          {NAV.map(({id,icon,label})=>(
            <button key={id} onClick={()=>{
              if(id==="predictor"){goPredict(null);}
              else setScreen(id);
            }} style={{
              flex:1,padding:"10px 4px",border:"none",background:"transparent",
              cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,
            }}>
              <span style={{fontSize:20}}>{icon}</span>
              <span style={{fontSize:10,fontWeight:600,color:screen===id||(id==="predictor"&&screen==="predictor")?C.accent:C.low}}>
                {label}
              </span>
              {(screen===id||(id==="predictor"&&screen==="predictor"))&&
                <div style={{width:16,height:2,borderRadius:1,background:C.accent}}/>
              }
            </button>
          ))}
        </div>
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
